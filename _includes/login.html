<div id="login-overlay" role="dialog" aria-modal="true" aria-labelledby="login-title" data-hash="{{ site.auth.sha256 }}">
  <div class="login-card">
    <div class="login-mark" aria-hidden="true">🔬</div>
    <h1 id="login-title">{{ site.title }}</h1>
    <p class="muted">Enter the passphrase to open your notebook.</p>
    <form id="login-form" autocomplete="off">
      <input type="password" id="login-input" placeholder="Passphrase" aria-label="Passphrase">
      <button type="submit" class="btn btn-primary btn-block">Unlock</button>
      <p id="login-error" class="login-error" role="alert" hidden>Incorrect passphrase &mdash; try again.</p>
    </form>
    <p class="login-note small muted">Cosmetic gate only &mdash; this static site is public and content is not encrypted.</p>
  </div>
</div>
